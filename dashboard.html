<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalMarket - Browse Products</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="main-nav">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>Local<span>Market</span></h2>
            </div>
            
            <div class="nav-search">
                <input type="text" id="searchProducts" placeholder="Search products...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            
            <div class="nav-menu">
                <a href="dashboard.html" class="active"><i class="fas fa-home"></i> Home</a>
                <a href="profile.html"><i class="fas fa-user"></i> My Profile</a>
                <a href="about.html"><i class="fas fa-info-circle"></i> About</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
            
            <div class="mobile-menu-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div class="mobile-menu" id="mobileMenu">
            <a href="dashboard.html" class="active">Home</a>
            <a href="profile.html">My Profile</a>
            <a href="about.html">About</a>
            <a href="#" id="mobileLogout">Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard">
        <div class="container">
            <!-- Welcome Message -->
            <div class="welcome-section">
                <h1>Welcome back, <span id="userNameDisplay">User</span>!</h1>
                <p>Browse products from your community</p>
            </div>
            
            <!-- Products Grid -->
            <div class="products-section">
                <div class="section-header">
                    <h2>Available Products</h2>
                    <select id="sortProducts" class="sort-select">
                        <option value="newest">Newest First</option>
                        <option value="priceLow">Price: Low to High</option>
                        <option value="priceHigh">Price: High to Low</option>
                    </select>
                </div>
                
                <div class="products-grid" id="productsGrid">
                    <!-- Products will be loaded here -->
                    <div class="loading">Loading products...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeProductModal">&times;</span>
            <div id="productDetail" class="product-detail">
                <!-- Product details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
